<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Unison Notes</title>
    <meta name="description" content="Group notes where everyone writes alone and Unison weaves one shared, organized doc." />
    <meta name="theme-color" content="#f4f5f7" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      // Apply the saved theme before first paint so there's no flash.
      (function () {
        try {
          var s = Object.assign({ mode: "system", light: "light", dark: "dark" }, JSON.parse(localStorage.getItem("unison.theme") || "{}"));
          var mode = s.mode === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : s.mode;
          document.documentElement.dataset.theme = s[mode] || mode;
          document.documentElement.dataset.mode = mode;
        } catch (e) {}
      })();
    </script>
    <script type="importmap">
      {
        "imports": {
          "preact": "./vendor/preact.mjs",
          "preact/hooks": "./vendor/preact-hooks.mjs",
          "htm": "./vendor/htm.mjs"
        }
      }
    </script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Unison Notes needs JavaScript.</noscript>
  </body>
</html>
